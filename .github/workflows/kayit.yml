# Koşu günü AGF/ganyan kayıt planı (scripts/agf_plan.py) GitHub sunucularında.
# Repo AÇIK ise: tek iş her dakika planı çalıştırır (ücretsiz), ~5,7 saatte bir kendini yeniden başlatır, gün bitince durur.
# Repo GİZLİ ise: dakika harcamamak için tek seferlik çalışır (zamanlanmış çalıştırmalar seyrek gelebilir).
# Saatler UTC (İstanbul = UTC+3). Zamanlama yalnızca başlatıcı; çalışan iş varsa yenisi sırada bekler.
name: kayit
on:
  schedule:
    - cron: '0 5-20 * * *'   # 08:00 İstanbul başlar (kullanıcı kararı 22.11: ilk yayını yakalamak için); sonraki saatler yedek
  workflow_dispatch:
    inputs:
      test:
        description: 'Plan yerine doğrudan bir AGF kaydı al (bağlantı testi)'
        type: boolean
        default: false
concurrency:
  group: kayit
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  kayit:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo python3 -m pip install --quiet --break-system-packages numpy   # sistem geneli: betikler python3 -I ile çalışır (kullanıcı paketlerini görmez)
      - name: Plan döngüsü
        run: |
          set +e
          git config user.name "kayit-bot"; git config user.email "kayit-bot@users.noreply.github.com"
          kaydet() {
            for y in veri/sonuc veri/sonuc_temiz veri/hiz_puani.json veri/jokey_tablo.json veri/kosu_turu_analiz.json veri/maiden_analiz.json veri/soy_kayit.json veri/at_gecmisi veri/kazanan_profil.csv veri/agf_kayit veri/muhtemel_kayit veri/tahminler veri/plan veri/son_dakika veri/tahminler_10dk veri/hata_raporu veri/kosu_tipi_kayit.csv veri/kosu_tipi_rapor.md veri/canli_takip*.csv veri/para_takip.csv analizler; do [ -e "$y" ] && git add -A "$y"; done
            git diff --cached --quiet && return 0
            git commit -q -m "AGF/ganyan kaydı (Actions)"
            for i in 1 2 3 4; do git pull -q --rebase --autostash -X theirs && git push -q && return 0; git rebase --abort 2>/dev/null; sleep $((i*10)); done
          }
          if [ "${{ github.event.inputs.test }}" = "true" ]; then python3 -I scripts/agf_kayit.py; kaydet; exit 0; fi
          ozel=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          bas=$(date +%s); bitti=0
          while :; do
            git pull -q --rebase --autostash -X theirs || git rebase --abort 2>/dev/null
            python3 -I scripts/agf_plan.py; kod=$?
            kaydet
            [ "$kod" -eq 3 ] && { bitti=1; break; }
            [ "$(TZ=Europe/Istanbul date +%H%M)" -gt 2340 ] && { bitti=1; break; }
            [ "$ozel" = "true" ] && break
            [ $(( $(date +%s) - bas )) -gt 20400 ] && break
            sleep 60
          done
          if [ "$bitti" = "1" ]; then
            python3 -I scripts/at_gecmisi.py ekle "$(TZ=Europe/Istanbul date +%F)" "$(TZ=Europe/Istanbul date -d yesterday +%F)" || true
            python3 -I scripts/kazanan_profil.py guncelle "$(TZ=Europe/Istanbul date +%F)" "$(TZ=Europe/Istanbul date -d yesterday +%F)" || true
            kaydet
          elif [ "$ozel" != "true" ]; then
            gh workflow run kayit.yml --ref "$GITHUB_REF_NAME"
          fi
